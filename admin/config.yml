backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "content"
    label: "Homepage, Promos & Flavors"
    files:
      - file: "content.json"
        label: "Site Content"
        name: "site_content"
        fields:
          - {label: "Logo Image", name: "logoImage", widget: "image"}
          - {label: "Promo Banner Text", name: "promoBanner", widget: "string"}
          - {label: "Tagline", name: "tagline", widget: "string"}
          - {label: "Hero Title", name: "heroTitle", widget: "string"}
          - {label: "Hero Subtitle", name: "heroSubtitle", widget: "string"}
          - {label: "Messenger URL", name: "messengerUrl", widget: "string"}
          - {label: "Facebook Page URL", name: "facebookPageUrl", widget: "string"}
          - label: "Treats Grid"
            name: "treats"
            widget: "list"
            fields:
              - {label: "Treat Name", name: "name", widget: "string"}
              - {label: "Description", name: "desc", widget: "string"}
              - {label: "Price", name: "price", widget: "string"}
              - {label: "Tag (e.g. Best Seller)", name: "tag", widget: "string"}
              - {label: "Color Code (e.g. #d97706)", name: "color", widget: "string"}
              - {label: "Product Image", name: "image", widget: "image"}