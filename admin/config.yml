backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "content"
    label: "Homepage, Promos & Flavors"
    files:
      - file: "content.json"
        label: "Site Content"
        name: "site_content"
        fields:
          - {label: "Hero Title", name: "hero_title", widget: "string"}
          - {label: "Promo Text", name: "promo_text", widget: "string"}