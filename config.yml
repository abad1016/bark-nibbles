backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "promo_settings"
    label: "Bark Nibbles Website Editor"
    files:
      - label: "Homepage, Promos & Flavors"
        name: "home"
        file: "content.json"
        fields:
          - { label: "Business Logo (Circle)", name: "logoImage", widget: "image", required: false }
          - { label: "Business Name (For SEO)", name: "businessName", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Top Promo Banner", name: "promoBanner", widget: "string" }
          - { label: "Main Hero Headline", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text" }
          - { label: "Messenger Order Link", name: "messengerUrl", widget: "string" }
          - { label: "Facebook Page Link", name: "facebookPageUrl", widget: "string" }
         - label: "Treat Flavors"
            name: "treats"
            widget: "list"
            fields:
              - { label: "Product Photo", name: "image", widget: "image", required: false }
              - { label: "Flavor Name", name: "name", widget: "string" }
              - { label: "Badge Tag", name: "tag", widget: "string" }
              - { label: "Price", name: "price", widget: "string" }
              - { label: "Accent Color (Hex)", name: "color", widget: "string", default: "#5A87A0" }
              - { label: "Description", name: "desc", widget: "text" }